<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RenStep">
  <title>RenStep</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div><div class="brand"><img class="logo" src="icons/icon-192.png" alt="" width="20" height="20">RenStep</div><h1 id="title">Today</h1></div>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙︎</button>
  </header>
  <main id="view" tabindex="-1"></main>
  <div id="restTimer" class="rest-timer hidden" role="status" aria-live="polite"></div>
  <nav class="tabbar" aria-label="Sections">
    <button data-tab="today" class="active"><span class="ti">◎</span><span>Today</span></button>
    <button data-tab="train"><span class="ti">▲</span><span>Train</span></button>
    <button data-tab="history"><span class="ti">≡</span><span>History</span></button>
    <button data-tab="rewards"><span class="ti">★</span><span>Rewards</span></button>
  </nav>
  <div id="modalRoot"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="firebase-config.js"></script>
  <script src="notes.js"></script>
  <script src="app.js"></script>
</body>
</html>
